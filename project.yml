name: Masalci
options:
  bundleIdPrefix: tr.kirke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  MasalciCore:
    path: .
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.81.2
targets:
  Masalci:
    type: application
    platform: iOS
    sources:
      - path: Targets/App/Sources/NewApp
      - path: Targets/App/Sources/DesignSystem
      - path: Targets/App/Sources/Features
      - path: Targets/App/Resources/Assets.xcassets
        buildPhase: resources
      - path: Targets/App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MasalciCore
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.kirke.masalci
        PRODUCT_NAME: Masalcı
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Targets/App/Resources/Masalci.entitlements
        API_BASE_URL: https://masalci-api.emre.zip
        MASALCI_DEVICE_PREVIEW: "NO"
        REVENUECAT_IOS_API_KEY: ""
    info:
      path: Targets/App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Masalcı
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APIBaseURL: $(API_BASE_URL)
        MasalciDevicePreview: $(MASALCI_DEVICE_PREVIEW)
        RevenueCatAPIKey: $(REVENUECAT_IOS_API_KEY)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  MasalciTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Targets/App/Tests
        excludes:
          - Fixtures
      - path: Targets/App/Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Masalci
      - package: MasalciCore
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Masalcı.app/Masalcı
        BUNDLE_LOADER: $(TEST_HOST)
  MasalciUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Targets/App/UITests
    dependencies:
      - target: Masalci
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: true
schemes:
  Masalci:
    build:
      targets:
        Masalci: all
        MasalciTests: [test]
        MasalciUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MasalciTests
        - MasalciUITests
